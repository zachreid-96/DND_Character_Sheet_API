server {
        listen 443 ssl;
        server_name {your_server_name};

        ssl_certificate /etc/nginx/cloud/cloudflare_cert.pem;
        ssl_certificate_key /etc/nginx/cloud/cloudflare_key.pem;

        access_log /var/log/nginx/{your_log_name}.access.log true_ip;
        error_log /var/log/nginx/{your_log_name}.error.log warn;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";

        # Token issuance: tight limit, no burst
        location = /get-token {
                limit_req zone=dnd_token nodelay;
                limit_except POST { deny all; }

                proxy_pass http://127.0.0.1:8000;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Generator endpoints
        location ~ ^/(generator-2014|generator-2024|generator-random)$ {
                limit_req zone=dnd_api burst=50 nodelay;
                limit_except POST { deny all; }

                proxy_pass http://127.0.0.1:8000;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Reject everything else explicitly
        location / {
            return 404;
        }
}